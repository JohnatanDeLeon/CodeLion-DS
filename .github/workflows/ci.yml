name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================
  # TESTING & LINTING
  # =====================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type check
        run: npm run type-check
        
      - name: Lint
        run: npm run lint
        
      - name: Test
        run: npm run test:coverage
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info

  # =====================================
  # BUILD & VISUAL TESTING
  # =====================================
  build:
    name: Build & Visual Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build library
        run: npm run build
        
      - name: Build Storybook
        run: npm run build-storybook
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist/
            storybook-static/
          retention-days: 30

  # =====================================
  # CHANGESET VERSION & RELEASE
  # =====================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    # contents/pull-requests: changesets abre el PR de versión y crea los
    # releases. id-token: npm Trusted Publishing, que publica en npmjs con el
    # OIDC de este workflow en vez de un token guardado.
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@johnatandeleon'
          always-auth: true
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Configure npm auth for GitHub Packages
        run: |
          npm config set @johnatandeleon:registry https://npm.pkg.github.com/
          npm config set //npm.pkg.github.com/:_authToken ${NODE_AUTH_TOKEN}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          version: npx changeset version
          commit: 'chore: version bump'
          title: 'chore: version bump'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NPM_CONFIG_REGISTRY: https://npm.pkg.github.com/

      # The same version also goes to the public npm registry. GitHub Packages
      # asks for a token even to install a public package, so every consumer
      # (CI runners, Docker builds, local machines) would need one; npmjs does
      # not.
      #
      # Trusted Publishing: npm accepts this workflow's OIDC identity, so there
      # is no token to store or rotate, and the package gets provenance. It
      # needs npm >= 11.5.1 and the package configured on npmjs.com with this
      # repository and workflow file. The scope registry is overridden on the
      # command line because the repo .npmrc maps @johnatandeleon to GitHub
      # Packages.
      - name: Publish to npmjs
        if: steps.changesets.outputs.published == 'true'
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public --provenance \
            --@johnatandeleon:registry=https://registry.npmjs.org

  # =====================================
  # DEPLOY STORYBOOK (opcional)
  # =====================================
  deploy-storybook:
    name: Deploy Storybook
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    
    permissions:
      pages: write
      id-token: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Storybook
        run: npm run build-storybook
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PACKAGES_TOKEN }}
          publish_dir: ./storybook-static
          enable_jekyll: false
          force_orphan: true